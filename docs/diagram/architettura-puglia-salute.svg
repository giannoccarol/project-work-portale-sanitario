<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="650" viewBox="0 0 1800 650">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#25303b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="10" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f766e; }
      .head { font: 700 31px Arial, sans-serif; fill: #172033; }
      .line { font: 25px Arial, sans-serif; fill: #334155; }
      .label { font: 700 22px Arial, sans-serif; fill: #334155; }
      .box { stroke-width: 4; rx: 22; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1800" height="650" fill="#ffffff"/>
  <text x="900" y="58" text-anchor="middle" class="title">Puglia Salute · Architettura applicativa</text>

  <rect x="55" y="150" width="465" height="360" class="box" fill="#ecfdf5" stroke="#14b8a6"/>
  <text x="287" y="215" text-anchor="middle" class="head">Browser</text>
  <text x="287" y="270" text-anchor="middle" class="line">Angular 21 SPA</text>
  <text x="287" y="320" text-anchor="middle" class="line">PrimeNG 21 + Aura</text>
  <text x="287" y="370" text-anchor="middle" class="line">Signals + RxJS</text>
  <text x="287" y="420" text-anchor="middle" class="line">Transloco · tema chiaro</text>
  <text x="287" y="470" text-anchor="middle" class="line">Porta 4200</text>

  <rect x="730" y="150" width="500" height="360" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="980" y="215" text-anchor="middle" class="head">REST API</text>
  <text x="980" y="270" text-anchor="middle" class="line">Express + TypeScript</text>
  <text x="980" y="320" text-anchor="middle" class="line">JWT + controllo ruoli</text>
  <text x="980" y="370" text-anchor="middle" class="line">TypeORM</text>
  <text x="980" y="420" text-anchor="middle" class="line">Swagger / OpenAPI</text>
  <text x="980" y="470" text-anchor="middle" class="line">Porta 3000 · /api/v1</text>

  <rect x="1450" y="115" width="300" height="190" class="box" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="1600" y="185" text-anchor="middle" class="head">SQLite</text>
  <text x="1600" y="235" text-anchor="middle" class="line">database locale</text>
  <text x="1600" y="275" text-anchor="middle" class="line">via TypeORM</text>

  <rect x="1450" y="365" width="300" height="190" class="box" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1600" y="435" text-anchor="middle" class="head">Uploads</text>
  <text x="1600" y="485" text-anchor="middle" class="line">allegati PDF</text>
  <text x="1600" y="525" text-anchor="middle" class="line">gestiti da Multer</text>

  <line x1="520" y1="330" x2="710" y2="330" stroke="#25303b" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="555" y="288" width="120" height="44" rx="8" fill="#e2e8f0"/>
  <text x="615" y="318" text-anchor="middle" class="label">/api JSON</text>

  <line x1="1230" y1="255" x2="1430" y2="215" stroke="#25303b" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="1280" y="185" width="105" height="42" rx="8" fill="#dbeafe"/>
  <text x="1332" y="214" text-anchor="middle" class="label">query</text>

  <line x1="1230" y1="405" x2="1430" y2="455" stroke="#25303b" stroke-width="6" marker-end="url(#arrow)"/>
  <rect x="1280" y="435" width="105" height="42" rx="8" fill="#ede9fe"/>
  <text x="1332" y="464" text-anchor="middle" class="label">PDF</text>

  <text x="900" y="610" text-anchor="middle" class="line">PrimeNG, PrimeIcons e PrimeFlex restano dipendenze esterne: nessuna libreria UI è copiata nel progetto.</text>
</svg>
